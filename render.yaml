services:
  - type: web
    name: table-thyme-pos
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm install --prefix server --include=dev && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: COOKIE_MAX_AGE_SECONDS
        value: 43200
