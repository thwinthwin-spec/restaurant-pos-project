name: Deploy to AWS ECS Express

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy:
    name: Build and deploy
    if: ${{ vars.AWS_REGION != '' && vars.AWS_GITHUB_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy initial service
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          cluster: ${{ env.ECS_CLUSTER }}
          container-port: '5000'
          health-check-path: /api/health
          cpu: '256'
          memory: '512'
          min-task-count: '1'
          max-task-count: '2'
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: '70'
          environment-variables: |
            [
              {"name": "NODE_ENV", "value": "production"},
              {"name": "PORT", "value": "5000"},
              {"name": "CLIENT_ORIGIN", "value": "${{ vars.CLIENT_ORIGIN || 'https://example.invalid' }}"}
            ]
          secrets: |
            [
              {"name": "MONGODB_URI", "valueFrom": "${{ vars.MONGODB_URI_PARAMETER }}"},
              {"name": "JWT_SECRET", "valueFrom": "${{ vars.JWT_SECRET_PARAMETER }}"}
            ]

      - name: Deploy with final origin
        if: ${{ vars.CLIENT_ORIGIN == '' }}
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ vars.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRASTRUCTURE_ROLE_ARN }}
          cluster: ${{ env.ECS_CLUSTER }}
          container-port: '5000'
          health-check-path: /api/health
          cpu: '256'
          memory: '512'
          min-task-count: '1'
          max-task-count: '2'
          auto-scaling-metric: AVERAGE_CPU
          auto-scaling-target-value: '70'
          environment-variables: |
            [
              {"name": "NODE_ENV", "value": "production"},
              {"name": "PORT", "value": "5000"},
              {"name": "CLIENT_ORIGIN", "value": "${{ steps.deploy.outputs.endpoint }}"}
            ]
          secrets: |
            [
              {"name": "MONGODB_URI", "valueFrom": "${{ vars.MONGODB_URI_PARAMETER }}"},
              {"name": "JWT_SECRET", "valueFrom": "${{ vars.JWT_SECRET_PARAMETER }}"}
            ]

      - name: Show endpoint
        run: |
          echo "### Table & Thyme POS deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deploy.outputs.endpoint }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health: ${{ steps.deploy.outputs.endpoint }}/api/health" >> "$GITHUB_STEP_SUMMARY"
