services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: restaurant_pos
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/restaurant_pos
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      JWT_EXPIRES_IN: 12h
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY: "true"
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
